<!DOCTYPE html>
<html>
<body>
  <h1>{{ object.name }}</h1>
  <p>{{ object.description }}</p>
  <p>Priority: {{ object.get_priority_display }}</p>
  <p>Deadline: {{ object.deadline }}</p>
  <p>Completed: {{ object.is_completed }}</p>
  <p>Type: {{ object.task_type }}</p>
  <a href="{% url 'task-update' object.pk %}">Edit</a> |
  <a href="{% url 'task-delete' object.pk %}">Delete</a>
</body>
</html>
